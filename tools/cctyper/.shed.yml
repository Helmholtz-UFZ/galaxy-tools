categories:
- Sequence Analysis
- Genome annotation
description: Detect, annotate and subtype CRISPR-Cas loci
long_description: |
  CRISPRCasTyper detects CRISPR-Cas systems in nucleotide sequences. Cas genes
  are found with a large set of HMM profiles, grouped into operons and their
  subtype is predicted; CRISPR arrays are detected with diced, their repeat is
  subtyped with an xgboost model, and operons and arrays are connected into
  CRISPR-Cas loci. A map of the detected loci is drawn as vector graphics.
name: cctyper
owner: iuc
homepage_url: https://github.com/Russel88/CRISPRCasTyper
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/cctyper
type: unrestricted
